[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.1.0"
description = "Scope-aware black-box reconnaissance case file for authorized programs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33"]
dev = ["pytest>=8"]

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindspot = ["dashboard/static/*"]
